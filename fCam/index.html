<style>
:root{--primary:#ffa000;--primary-dark:#ff8f00;--text:#212121;--muted:#757575;--bg:#fafafa;--danger:#b71c1c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Roboto,"Segoe UI",system-ui,Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--text)}
.row{display:flex;align-items:center}
.grow{flex:1;min-width:0}
#appTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit}

/* app bar */
.bar{position:fixed;top:0;left:0;right:0;height:56px;padding:0 8px 0 12px;background:var(--primary);color:#fff;
 box-shadow:0 2px 4px rgba(0,0,0,.3);z-index:10;font-size:20px;font-weight:500}
.bar .logo-link{display:flex;margin-right:12px;flex:none}
.bar .logo{width:32px;height:32px;display:block}
.bar.sel{display:none;background:#424242;font-size:16px;padding-left:16px}
body.selecting .bar.main{display:none}
body.selecting .bar.sel{display:flex}
.btn{background:none;border:0;color:inherit;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;
 height:36px;padding:0 12px;margin-left:4px;border-radius:4px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.18)}
.ibtn{width:40px;height:40px;padding:0;margin-left:2px;border:0;border-radius:50%;background:none;color:#fff;cursor:pointer;
 display:flex;align-items:center;justify-content:center}
.ibtn:hover{background:rgba(255,255,255,.18)}
.ibtn:disabled{opacity:.5;cursor:default;background:none}
.ibtn.rot svg{animation:sp .8s linear infinite}
.ibtn svg{width:24px;height:24px;fill:currentColor}
.ibtn svg.line{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* status message in the middle of the app bar */
#hdrMsg{position:fixed;top:0;left:50%;transform:translateX(-50%);height:56px;z-index:11;display:flex;align-items:center;
 max-width:calc(100vw - 260px);pointer-events:none;color:#fff;font-size:14px;font-weight:500}
#hdrMsg .pill{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:5px 14px;border-radius:16px;background:rgba(255,255,255,.25)}
#hdrMsg .pill.err{background:var(--danger)}

/* content */
#app,#login{padding-top:72px}
.wrap{max-width:1100px;margin:0 auto;padding:0 8px}
.card{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:16px;margin-bottom:12px}
.muted{color:var(--muted)}
.track{height:6px;background:#ffe0b2;border-radius:3px;margin-top:10px;overflow:hidden}
.fill{height:100%;width:0;background:var(--primary)}

/* thumbnails */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:4/3;background:#e0e0e0;border-radius:4px;overflow:hidden;cursor:pointer;
 box-shadow:0 1px 3px rgba(0,0,0,.2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sel{outline:3px solid var(--primary);outline-offset:-3px}
.thumb.sel img{opacity:.8}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 4px;font-size:11px;color:#fff;
 background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.6));pointer-events:none}
.thumb .chk{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;
 background:rgba(0,0,0,.3)}
.thumb.sel .chk{background:var(--primary);border-color:var(--primary)}
.thumb.sel .chk::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid #fff;
 border-width:0 2px 2px 0;transform:rotate(45deg)}
.raised{background:var(--primary);color:#fff;box-shadow:0 2px 3px rgba(0,0,0,.3);padding:0 20px;margin:0}
.raised:hover{background:var(--primary-dark)}
#more{display:none;margin:12px auto}
#empty{display:none;text-align:center;padding:40px 0}

/* login */
#login{display:none}
.lcard{max-width:320px;margin:40px auto 0}
.lcard h2{margin:0 0 16px;font-size:20px;font-weight:500}
.field{width:100%;font:inherit;font-size:16px;padding:8px 0;border:0;border-bottom:2px solid var(--primary);background:none;outline:none;color:var(--text)}
.err{color:var(--danger);min-height:20px;margin-top:8px}

/* lightbox */
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:20}
#lb.open{display:block}
#lbImg{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%}
#lbCap{position:absolute;left:0;right:0;bottom:0;padding:8px 16px;color:#eee;background:rgba(0,0,0,.5);font-size:13px;text-align:center}
.lbb{position:absolute;color:#fff;background:rgba(0,0,0,.4);border:0;border-radius:50%;width:48px;height:48px;
 font-size:30px;line-height:48px;text-align:center;cursor:pointer;padding:0}
.lbb:hover{background:rgba(0,0,0,.7)}
#lbClose{top:8px;right:8px}
#lbPrev{left:8px;top:calc(50% - 24px)}
#lbNext{right:8px;top:calc(50% - 24px)}

/* config dialog */
dialog.dlg{border:0;border-radius:4px;padding:0;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px);
 box-shadow:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14);color:var(--text)}
dialog.dlg::backdrop{background:rgba(0,0,0,.5)}
#cfgForm{padding:20px 24px 12px}
#cfgForm h2{margin:0 0 12px;font-size:20px;font-weight:500}
.fl{display:block;margin-top:14px;font-size:12px;color:var(--muted)}
.chkrow{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--text)}
.chkrow input{width:18px;height:18px;accent-color:var(--primary)}
select.field{background:#fff}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.actions .btn{color:var(--primary-dark);margin:0}
.actions .btn:hover{background:rgba(255,160,0,.12)}
.actions .raised{color:#fff}
.actions .raised:hover{background:var(--primary-dark)}
.hint{margin-top:10px;font-size:12px;color:var(--muted)}
.actions .btn.danger{color:var(--danger);margin-right:auto}
.actions .btn.danger:hover{background:rgba(183,28,28,.1)}

/* system info dialog */
#infoBox{padding:20px 24px 12px}
#infoBox h2{margin:0 0 8px;font-size:20px;font-weight:500}
.irow{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #eee}
.irow .k{color:var(--muted);flex:none}
.irow .v{text-align:right;word-break:break-word}

/* waiting overlay */
#wait{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:30;align-items:center;justify-content:center;
 flex-direction:column;gap:16px;font-size:16px}
#wait.on{display:flex}
.spin{width:40px;height:40px;border:4px solid #ffe0b2;border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="bar main row">
  <a class="logo-link" href="https://github.com/ffps/fcam" target="_blank" rel="noopener" title="fCam on GitHub">
    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
      <rect width="120" height="120" rx="26" fill="#fff"/>
      <circle cx="30" cy="60" r="7" fill="#ffa000"/>
      <circle cx="56" cy="60" r="11" fill="#ffa000"/>
      <circle cx="90" cy="60" r="16" fill="#ffa000"/>
    </svg>
  </a>
  <div class="grow" id="appTitle">fCam</div>
  <span class="row" id="tools" style="display:none">
    <button class="ibtn" id="bShot" title="Сделать снимок" aria-label="Сделать снимок">
      <svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M10.382 2a1 1 0 0 1 .894.553L12 4h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2l.724-1.447A1 1 0 0 1 5.618 2zM8 6a3 3 0 1 0 0 6a3 3 0 0 0 0-6m5-1a1 1 0 1 0 0 2a1 1 0 0 0 0-2"/></svg>
    </button>
    <button class="ibtn" id="bCfg" title="Настройки" aria-label="Настройки">
      <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19.39 10.23 L22.15 11.04 L22.15 12.96 L19.39 13.77 L18.48 15.97 L19.86 18.50 L18.50 19.86 L15.97 18.48 L13.77 19.39 L12.96 22.15 L11.04 22.15 L10.23 19.39 L8.03 18.48 L5.50 19.86 L4.14 18.50 L5.52 15.97 L4.61 13.77 L1.85 12.96 L1.85 11.04 L4.61 10.23 L5.52 8.03 L4.14 5.50 L5.50 4.14 L8.03 5.52 L10.23 4.61 L11.04 1.85 L12.96 1.85 L13.77 4.61 L15.97 5.52 L18.50 4.14 L19.86 5.50 L18.48 8.03Z M15.40 12 A3.4 3.4 0 1 0 8.60 12 A3.4 3.4 0 1 0 15.40 12Z"/></svg>
    </button>
    <button class="ibtn" id="bInfo" title="Сведения" aria-label="Сведения">
      <svg class="line" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><path d="M12 7.6h.01"/></svg>
    </button>
    <button class="ibtn" id="bRefresh" title="Обновить" aria-label="Обновить">
      <svg viewBox="0 0 1024 1024"><path d="M771.8 794.9A384 384 0 0 1 128 512h64a320 320 0 0 0 555.7 216.4h-93a32 32 0 1 1 0-64h149a32 32 0 0 1 32 32v149a32 32 0 1 1-64 0zM276.3 295.6h93a32 32 0 0 1 0 64H220.2a32 32 0 0 1-32-32v-149a32 32 0 0 1 64 0V229a384 384 0 0 1 644 282.9h-64a320 320 0 0 0-555.8-216.4z"/></svg>
    </button>
    <button class="ibtn" id="bLogout" title="Выйти" aria-label="Выйти">
      <svg class="line" viewBox="0 0 24 24"><path d="M10 4H5v16h5"/><path d="M16 8l4 4-4 4"/><path d="M9 12h11"/></svg>
    </button>
  </span>
</header>
<header class="bar sel row">
  <div class="grow" id="selN">Выбрано: 0</div>
  <button class="btn" id="bAll">Все</button>
  <button class="btn" id="bDel">Удалить</button>
  <button class="btn" id="bCancel">Отмена</button>
</header>

<div id="hdrMsg"></div>

<div id="login">
  <div class="wrap">
    <form class="card lcard" id="loginForm">
      <h2>Вход</h2>
      <input class="field" type="password" id="pw" placeholder="Пароль" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button type="submit" class="btn raised">Войти</button>
    </form>
  </div>
</div>

<main id="app" style="display:none">
  <div class="wrap">
    <div class="card">
      <div id="storText">Загрузка…</div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="muted" id="cnt" style="margin-top:8px"></div>
    </div>
    <div id="grid"></div>
    <div class="card muted" id="empty">Фото нет</div>
    <div style="text-align:center"><button class="btn raised" id="more">Показать ещё</button></div>
  </div>
</main>

<div id="lb">
  <img id="lbImg" alt="">
  <div id="lbCap"></div>
  <button class="lbb" id="lbClose" aria-label="Закрыть">&times;</button>
  <button class="lbb" id="lbPrev" aria-label="Назад">&#8249;</button>
  <button class="lbb" id="lbNext" aria-label="Вперёд">&#8250;</button>
</div>

<dialog id="cfg" class="dlg">
  <form id="cfgForm" method="dialog">
    <h2>Настройки</h2>
    <label class="chkrow"><input type="checkbox" id="c_autostart">Автозапуск при загрузке системы</label>

    <label class="fl" for="c_camera">Камера</label>
    <select class="field" id="c_camera"></select>

    <label class="fl" for="c_threshold">Порог срабатывания, % изменившихся точек</label>
    <input class="field" id="c_threshold" type="number" step="any" min="0.01" required>

    <label class="fl" for="c_min_gap">Минимальное время между сериями, сек</label>
    <input class="field" id="c_min_gap" type="number" step="1" min="0" required>

    <label class="fl" for="c_count">Кадров в серии</label>
    <input class="field" id="c_count" type="number" step="1" min="1" required>

    <label class="fl" for="c_interval">Интервал между кадрами серии, сек</label>
    <input class="field" id="c_interval" type="number" step="any" min="0" required>

    <label class="fl" for="c_keep_days">Хранить фото, дней (0 — не удалять)</label>
    <input class="field" id="c_keep_days" type="number" step="1" min="0" required>

    <label class="fl" for="c_reboot_cron">Автоперезагрузка устройства (crontab: мин час день месяц день_недели; пусто — выключена)</label>
    <input class="field" id="c_reboot_cron" type="text" placeholder="например: 0 4 * * *" autocomplete="off" spellcheck="false">
    <div class="hint" id="c_reboot_hint"></div>

    <label class="fl" for="c_port">Порт управления (1024–65535)</label>
    <input class="field" id="c_port" type="number" step="1" min="1024" max="65535" required>

    <label class="fl" for="c_password">Пароль управления (пусто — без авторизации)</label>
    <input class="field" id="c_password" type="password" autocomplete="new-password">

    <div class="hint">При сохранении сервис перезапустится, страница перезагрузится.</div>
    <div class="err" id="cfgErr"></div>
    <div class="actions">
      <button type="button" class="btn" id="cfgCancel">Отмена</button>
      <button type="submit" class="btn raised">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog id="info" class="dlg">
  <div id="infoBox">
    <h2>Сведения</h2>
    <div id="infoRows"></div>
    <div class="err" id="infoErr"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="infoReboot" style="display:none">Перезагрузить устройство</button>
      <button type="button" class="btn" id="infoClose">Закрыть</button>
    </div>
  </div>
</dialog>

<div id="wait"><div class="spin"></div><div id="waitText">Перезапуск сервиса…</div></div>

<script>
(() => {
  const PAGE = 60;              // how many thumbnails to show at once
  const COOKIE = 'fcam_pw';
  let pw = '';
  let files = [];               // newest first
  let shown = 0;
  let cur = -1;                 // index of the photo in the viewer
  let busy = false;
  let loggedIn = false;
  let cfgOrig = null;
  const sel = new Set();
  const thumbs = new Map();     // name -> thumbnail element

  const $ = id => document.getElementById(id);

  /* ---------- cookie ---------- */
  const getCookie = () => {
    const m = document.cookie.match(new RegExp('(?:^|; )' + COOKIE + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  };
  const setCookie = v => { document.cookie = `${COOKIE}=${encodeURIComponent(v)}; max-age=31536000; path=/; SameSite=Lax`; };
  const delCookie = () => { document.cookie = `${COOKIE}=; max-age=0; path=/`; };

  /* ---------- API ---------- */
  const qs = (extra = {}) => new URLSearchParams({ password: pw, ...extra }).toString();
  const api = (path, extra, init) => fetch(`/api/${path}?${qs(extra)}`, init);
  const photoUrl = n => `/api/photo?${qs({ name: n })}`;
  const thumbUrl = n => `/api/thumb?${qs({ name: n })}`;

  /* ---------- formatting ---------- */
  const mb = b => Math.round(b / 1048576);
  const kb = b => Math.round(b / 1024);
  const noSec = t => t.substring(0, 16);            // drop the seconds
  const spaced = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');

  // show a short status message in the middle of the app bar (it does not move the page content)
  let curNote = '';
  function note(text, info) {
    curNote = text || '';
    const m = $('hdrMsg');
    m.textContent = '';
    m.title = '';
    if (!text) return;
    const span = document.createElement('span');
    span.className = 'pill' + (info ? '' : ' err');
    span.textContent = text;
    m.title = text;
    m.appendChild(span);
  }

  /* ---------- screens ---------- */
  function showLogin(err) {
    loggedIn = false;
    $('app').style.display = 'none';
    $('login').style.display = 'block';
    $('tools').style.display = 'none';
    $('loginErr').textContent = err || '';
    $('pw').value = '';
    document.body.classList.remove('selecting');
    setTimeout(() => $('pw').focus(), 50);
  }
  function showApp() {
    loggedIn = true;
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    $('tools').style.display = 'flex';
  }

  /* ---------- loading the list ---------- */
  async function load(userAttempt = false) {
    let r, ri;
    try {
      [r, ri] = await Promise.all([api('list'), api('info').catch(() => null)]);
    } catch (e) {
      return loggedIn ? note('Нет связи с устройством') : showLogin('Нет связи с устройством');
    }
    if (r.status === 403) {
      delCookie();
      return showLogin(userAttempt ? 'Неверный пароль' : '');
    }
    if (!r.ok) {
      return loggedIn ? note('Ошибка ' + r.status) : showLogin('Ошибка ' + r.status);
    }
    const d = await r.json();
    let inf = null;
    if (ri && ri.ok) {
      try { inf = await ri.json(); } catch (e) { /* the system info is optional */ }
    }
    setCookie(pw);
    showApp();
    apply(d, inf);
  }

  // "fCam - DeviceName" in the page header and in the browser tab title
  function setDeviceName(inf) {
    const name = inf && (inf.device_name || inf.model);
    const t = name ? `fCam - ${name}` : 'fCam';
    $('appTitle').textContent = t;
    document.title = t;
  }

  function apply(d, inf) {
    if (inf && inf.storage) {
      const total = mb(inf.storage.total_bytes), free = mb(inf.storage.free_bytes);
      $('storText').textContent = `Всего: ${spaced(total)} МБ · Свободно: ${spaced(free)} МБ`;
      $('fill').style.width = (total > 0 ? Math.max(0, Math.min(100, (total - free) * 100 / total)) : 0) + '%';
    } else {
      $('storText').textContent = 'Нет данных о памяти';
      $('fill').style.width = '0';
    }
    setDeviceName(inf);

    files = (d.files || []).slice().sort((a, b) =>
      a.time !== b.time ? (a.time < b.time ? 1 : -1) : (a.name < b.name ? 1 : -1));
    const sum = files.reduce((s, f) => s + f.size, 0);
    $('cnt').textContent = `Фото: ${files.length} (${spaced(mb(sum))} МБ)`;

    const exist = new Set(files.map(f => f.name));
    for (const n of [...sel]) if (!exist.has(n)) sel.delete(n);
    buildGrid();
    updateSel();
  }

  /* ---------- thumbnail grid ---------- */
  function buildGrid() {
    $('grid').textContent = '';
    thumbs.clear();
    shown = 0;
    $('empty').style.display = files.length ? 'none' : 'block';
    showMore();
  }

  function showMore() {
    const end = Math.min(shown + PAGE, files.length);
    const frag = document.createDocumentFragment();
    for (let i = shown; i < end; i++) frag.appendChild(makeThumb(files[i]));
    $('grid').appendChild(frag);
    shown = end;
    const more = $('more');
    more.style.display = shown < files.length ? 'inline-block' : 'none';
    more.textContent = `Показать ещё (${files.length - shown})`;
  }

  function makeThumb(f) {
    const d = document.createElement('div');
    d.className = 'thumb' + (sel.has(f.name) ? ' sel' : '');
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = '';
    img.src = thumbUrl(f.name);
    const chk = document.createElement('div');
    chk.className = 'chk';
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = noSec(f.time).substring(5);     // MM-DD hh:mm
    d.append(img, chk, cap);
    d.onclick = () => (sel.size ? toggle(f.name) : openViewer(files.findIndex(x => x.name === f.name)));
    chk.onclick = e => { e.stopPropagation(); toggle(f.name); };
    thumbs.set(f.name, d);
    return d;
  }

  /* ---------- selection ---------- */
  const paint = n => { const t = thumbs.get(n); if (t) t.classList.toggle('sel', sel.has(n)); };
  function toggle(n) {
    if (sel.has(n)) sel.delete(n); else sel.add(n);
    paint(n);
    updateSel();
  }
  function updateSel() {
    $('selN').textContent = 'Выбрано: ' + sel.size;
    document.body.classList.toggle('selecting', sel.size > 0);
  }
  function selectAll() {
    files.forEach(f => { sel.add(f.name); paint(f.name); });
    updateSel();
  }
  function clearSel() {
    const old = [...sel];
    sel.clear();
    old.forEach(paint);
    updateSel();
  }

  /* ---------- deleting ---------- */
  async function deleteSelected() {
    if (busy || !sel.size) return;
    const list = [...sel];
    // everything is selected: one command removes all the photos at once
    const all = files.length > 0 && list.length === files.length;
    if (!confirm(all ? `Удалить все фото (${list.length} шт.)?` : `Удалить фото: ${list.length} шт.?`)) return;
    busy = true;
    let failed = 0;
    let msg = '';
    if (all) {
      note('Удаление всех фото…', true);
      try {
        const r = await api('delete_all');
        let d = null;
        try { d = await r.json(); } catch (e) { /* not JSON */ }
        if (!r.ok) failed = d ? d.failed : list.length;
        else if (d && d.deleted > list.length) msg = `Удалено: ${d.deleted} (на странице было ${list.length})`;
      } catch (e) { failed = list.length; }
    } else {
      for (let i = 0; i < list.length; i++) {
        note(`Удаление ${i + 1} из ${list.length}…`, true);
        try {
          const r = await api('delete', { name: list[i] });
          if (!r.ok && r.status !== 404) failed++;
        } catch (e) { failed++; }
      }
    }
    busy = false;
    sel.clear();
    updateSel();
    note(failed ? `Не удалось удалить: ${failed}` : msg, !failed && !!msg);
    load();
  }

  /* ---------- manual shot ---------- */
  async function shootNow() {
    if (busy) return;
    busy = true;
    const btn = $('bShot');
    btn.disabled = true;
    note('Съёмка…', true);
    try {
      const r = await api('shot');
      if (r.status === 409) { note('Серия уже идёт'); return; }
      if (r.status === 503) { note('Камера недоступна'); return; }
      if (!r.ok) { note('Ошибка ' + r.status); return; }
      // wait until the whole series is taken: (count - 1) * interval + a small reserve
      let wait = 5000;
      try {
        const c = await (await api('config')).json();
        wait = Math.max(0, c.count - 1) * Math.max(300, c.interval * 1000) + 3000;
      } catch (e) { /* keep the default */ }
      await new Promise(res => setTimeout(res, wait));
      note('');
      await load();
    } catch (e) {
      note('Нет связи с устройством');
    } finally {
      busy = false;
      btn.disabled = false;
    }
  }

  /* ---------- viewer ---------- */
  function openViewer(i) {
    if (i < 0 || i >= files.length) return;
    cur = i;
    const f = files[i];
    $('lbImg').src = photoUrl(f.name);
    $('lbCap').textContent = `${f.name} · ${spaced(kb(f.size))} КБ · ${noSec(f.time)}  (${i + 1} из ${files.length})`;
    $('lb').classList.add('open');
  }
  function closeViewer() {
    $('lb').classList.remove('open');
    $('lbImg').removeAttribute('src');
    cur = -1;
  }
  function step(d) {
    if (cur < 0) return;
    const n = cur + d;
    if (n >= 0 && n < files.length) openViewer(n);
  }

  /* ---------- system info ---------- */
  const duration = sec => {
    const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    return (d ? d + ' д ' : '') + (d || h ? h + ' ч ' : '') + m + ' мин';
  };
  const PLUGGED = { ac: 'от сети', usb: 'по USB', wireless: 'беспроводная', none: 'от батареи' };

  async function openInfo() {
    let i;
    try {
      const r = await api('info');
      if (!r.ok) throw new Error(r.status);
      i = await r.json();
    } catch (e) {
      return note('Не удалось получить сведения');
    }
    const rows = [];
    const dev = [i.manufacturer, i.model].filter(Boolean).join(' ');
    rows.push(['Устройство', i.device_name && i.device_name !== i.model ? `${i.device_name} (${dev})` : dev]);
    rows.push(['Android', `${i.android} (API ${i.sdk})`]);
    rows.push(['Версия fCam', i.app_version]);
    rows.push(['Время на устройстве', `${i.time} (${i.timezone})`]);
    rows.push(['Работает с загрузки', duration(i.uptime_sec)]);
    rows.push(['Сервис работает', duration(i.service_uptime_sec)]);
    if (i.battery) {
      const b = i.battery;
      rows.push(['Батарея', `${b.percent}%, ${b.charging ? 'заряжается' : 'не заряжается'}, ${PLUGGED[b.plugged] || b.plugged}`]);
      rows.push(['Температура батареи', `${b.temperature_c} °C`]);
    }
    const RB = { deviceOwner: 'доступна (владелец устройства)', root: 'доступна (root)', accessibility: 'доступна (спец. возможности)', none: 'недоступна' };
    rows.push(['Перезагрузка устройства', RB[i.rebootMethod] || 'недоступна']);
    rows.push(['IP-адрес', (i.ips && i.ips.length ? i.ips : [i.ip]).join(', ')]);
    if (i.storage) rows.push(['Накопитель', `свободно ${spaced(mb(i.storage.free_bytes))} из ${spaced(mb(i.storage.total_bytes))} МБ`]);
    if (i.ram) rows.push(['Память (ОЗУ)', `свободно ${spaced(mb(i.ram.free_bytes))} из ${spaced(mb(i.ram.total_bytes))} МБ`]);

    const box = $('infoRows');
    box.textContent = '';
    for (const [k, v] of rows) {
      const row = document.createElement('div');
      row.className = 'irow';
      const a = document.createElement('span');
      a.className = 'k';
      a.textContent = k;
      const b = document.createElement('span');
      b.className = 'v';
      b.textContent = v;
      row.append(a, b);
      box.appendChild(row);
    }
    $('infoErr').textContent = '';
    $('infoReboot').style.display = i.canReboot ? '' : 'none';
    $('info').showModal();
  }

  const sleep = ms => new Promise(res => setTimeout(res, ms));

  // true if the device answers right now
  async function alive() {
    try {
      await fetch(`/api/info?${qs()}`, { cache: 'no-store' });
      return true;
    } catch (e) {
      return false;
    }
  }

  async function rebootDevice() {
    if (!confirm('Перезагрузить устройство? Киоск и камера будут недоступны несколько минут.')) return;
    let r;
    try {
      r = await api('reboot');
    } catch (e) {
      $('infoErr').textContent = 'Нет связи с устройством';
      return;
    }
    if (!r.ok) {
      let msg = 'Ошибка ' + r.status;
      try { msg = (await r.json()).message || msg; } catch (e) { /* not JSON */ }
      $('infoErr').textContent = msg;
      return;
    }
    $('info').close();
    $('waitText').textContent = 'Устройство перезагружается…';
    $('wait').classList.add('on');
    // phase 1: wait until the device goes down
    let down = false;
    for (let t = 0; t < 20 && !down; t++) {
      await sleep(2000);
      down = !(await alive());
    }
    if (!down) {
      $('wait').classList.remove('on');
      return note('Устройство не перезагрузилось');
    }
    // phase 2: wait until it is back (up to 5 minutes)
    for (let t = 0; t < 100; t++) {
      await sleep(3000);
      if (await alive()) return location.reload();
    }
    $('wait').classList.remove('on');
    note('Устройство не отвечает');
  }

  /* ---------- settings ---------- */
  const NUM = { threshold: parseFloat, min_gap: parseInt, count: parseInt, interval: parseFloat, keep_days: parseInt, port: parseInt };

  async function openConfig() {
    let c, inf = null;
    try {
      const [r, ri] = await Promise.all([api('config'), api('info').catch(() => null)]);
      if (!r.ok) throw new Error(r.status);
      c = await r.json();
      if (ri && ri.ok) inf = await ri.json();
    } catch (e) {
      return note('Не удалось получить настройки');
    }
    cfgOrig = c;
    $('c_autostart').checked = !!c.autostart;
    const sc = $('c_camera');
    sc.textContent = '';
    const names = (c.cameras && c.cameras.length) ? c.cameras : ['Камера ' + c.camera];
    names.forEach((t, i) => sc.add(new Option(t, i)));
    sc.value = String(c.camera);
    for (const k of Object.keys(NUM)) $('c_' + k).value = c[k];
    $('c_password').value = c.password || '';
    $('c_reboot_cron').value = c.reboot_cron || '';
    // the schedule is editable only when the app is allowed to reboot the device
    const canReboot = !!(inf && inf.canReboot);
    $('c_reboot_cron').disabled = !canReboot;
    $('c_reboot_hint').textContent = canReboot ? '' : 'Недоступно: у fCam нет прав на перезагрузку (см. «Сведения»).';
    $('cfgErr').textContent = '';
    $('cfg').showModal();
  }

  function readConfigForm() {
    const v = { autostart: $('c_autostart').checked, camera: parseInt($('c_camera').value, 10) };
    for (const k of Object.keys(NUM)) v[k] = NUM[k]($('c_' + k).value);
    v.password = $('c_password').value;
    v.reboot_cron = $('c_reboot_cron').value.trim();
    return v;
  }

  async function saveConfig(ev) {
    ev.preventDefault();
    const form = $('cfgForm');
    if (!form.reportValidity()) return;
    const v = readConfigForm();
    const changed = {};
    if ($('c_reboot_cron').disabled) delete v.reboot_cron;
    for (const k of Object.keys(v)) if (v[k] !== cfgOrig[k]) changed[k] = v[k];
    if (!Object.keys(changed).length) { $('cfg').close(); return; }

    let r;
    try {
      r = await api('config', {}, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(changed) });
    } catch (e) {
      $('cfgErr').textContent = 'Нет связи с устройством';
      return;
    }
    if (!r.ok) {
      $('cfgErr').textContent = r.status === 400 ? (await r.text()).trim() : 'Ошибка ' + r.status;
      return;
    }
    if ('password' in changed) { pw = changed.password; setCookie(pw); }
    const base = ('port' in changed) ? `${location.protocol}//${location.hostname}:${changed.port}` : location.origin;
    $('cfg').close();
    $('wait').classList.add('on');
    await new Promise(res => setTimeout(res, 1500));
    for (let i = 0; i < 40; i++) {
      try {
        await fetch(`${base}/api/list?${qs()}`, { mode: 'no-cors', cache: 'no-store' });   // the reply is not read, we only need to know that the server is up
        break;
      } catch (e) {
        await new Promise(res => setTimeout(res, 1000));
      }
    }
    location.href = base + '/';
  }

  /* ---------- events ---------- */
  $('loginForm').onsubmit = e => { e.preventDefault(); pw = $('pw').value; load(true); };
  let refreshing = false;
  $('bRefresh').onclick = async () => {
    if (refreshing) return;
    refreshing = true;
    const btn = $('bRefresh');
    btn.classList.add('rot');
    note('Обновление…', true);
    const t0 = Date.now();
    await load();
    // keep the feedback visible for a moment: a very fast refresh would look like nothing happened
    const left = 700 - (Date.now() - t0);
    if (left > 0) await new Promise(res => setTimeout(res, left));
    btn.classList.remove('rot');
    if (curNote === 'Обновление…') note('');       // do not hide an error shown by load()
    refreshing = false;
  };
  $('bLogout').onclick = () => { delCookie(); pw = ''; files = []; sel.clear(); showLogin(''); };
  $('bShot').onclick = shootNow;
  $('bCfg').onclick = openConfig;
  $('bInfo').onclick = openInfo;
  $('infoClose').onclick = () => $('info').close();
  $('infoReboot').onclick = rebootDevice;

  // close a dialog when the click is outside of it (on the dimmed backdrop), like Escape does
  function closeOnBackdrop(dlg) {
    let downOnBackdrop = false;     // a drag that starts inside (text selection) must not close the dialog
    dlg.addEventListener('pointerdown', e => { downOnBackdrop = e.target === dlg; });
    dlg.addEventListener('click', e => {
      if (downOnBackdrop && e.target === dlg) dlg.close();
      downOnBackdrop = false;
    });
  }
  closeOnBackdrop($('cfg'));
  closeOnBackdrop($('info'));
  $('cfgCancel').onclick = () => $('cfg').close();
  $('cfgForm').onsubmit = saveConfig;
  $('bAll').onclick = selectAll;
  $('bCancel').onclick = clearSel;
  $('bDel').onclick = deleteSelected;
  $('more').onclick = showMore;
  $('lbClose').onclick = closeViewer;
  $('lbPrev').onclick = () => step(-1);
  $('lbNext').onclick = () => step(1);
  $('lb').onclick = e => { if (e.target === $('lb')) closeViewer(); };
  document.addEventListener('keydown', e => {
    if (cur < 0) return;
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  });
  let wheelAt = 0;
  $('lb').addEventListener('wheel', e => {
    e.preventDefault();
    const now = Date.now();
    if (e.deltaY === 0 || now - wheelAt < 200) return;   // ignore bursts from touchpads
    wheelAt = now;
    step(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
  let tx = null;
  $('lb').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('lb').addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx;
    tx = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  });

  /* ---------- start ---------- */
  const saved = getCookie();
  pw = saved === null ? '' : saved;      // an empty password works if the device has none
  load();
})();
</script>
</body>
</html>
