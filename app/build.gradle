plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ffps.fcam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ffps.fcam'
        minSdk 17
        targetSdk 28
        versionCode (project.findProperty('verCode') ?: '1').toInteger()
        versionName (project.findProperty('verName') ?: '1.0.0')
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // без секретов с keystore подписываем debug-ключом, чтобы APK можно было установить
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
